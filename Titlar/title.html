<!DOCTYPE html>
<html lang="sv">

<head>
    <title>Universitetsbibliotekets förbättrade sökfunktion</title>
    <meta charset="UTF-8">
    <meta name="description" content="Universitetsbibliotekets förbättrade sökfunktion">
    <meta name="author" content="Svea Damberg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <script src="https://kit.fontawesome.com/7b7fa8ee5e.js" crossorigin="anonymous"></script>
    <!-- script för att hämta hem ikoner, ingen egenskriven js funktion-->

</head>

<body>
    <div class="container">
        <header>
            <nav>
                <div class="left">
                    <div class="dropdown">
                        <button type="button" aria-label="Öppna meny"><i class="fa-solid fa-bars"></i></button>
                        <ul class="dropdown-content" id="hamburger-content">
                            <li><a href="../Meny/account.html">Mitt konto</a></li>
                            <li><a href="../Meny/loans.html">Mina lån</a></li>
                            <li><a href="../Meny/saved.html">Mina sparade</a></li>
                        </ul>
                    </div>
                    <div class="vertical-line"></div>
                    <h1 class="main-text"><a href="../index.html">Bibliotek</a></h1>
                </div>

                <a href="../index.html"><img id="logo" src="../Bilder/umu_logga-modified.png"
                        alt="Umeå Universitet Logga"></a>

                <div class="right">
                    <div class="dropdown">
                        <button type="button" aria-label="Öppna profilmeny"><i class="fa-regular fa-user"></i></button>
                    </div>
                </div>
            </nav>
        </header>

        <div class="content-area" id="search-and-filter"> <!-- funktions får lösas sen med javascript-->
            <input type="text" placeholder="Sök..." id="search">

            <div class="active-filters"><button class="search-filter-button" type="button" aria-label="">Språk</button>
            </div>
            <div class="active-filters"><button class="search-filter-button" type="button"
                    aria-label="">Utgivningsår</button></div>

            <div class="dropdown" id="filter-dropdown">
                <button class="search-filter-button" type="button" aria-label="Filtrera sökresultat"><i
                        class="fa-solid fa-sliders"></i>Filtrera</button>
                <ul class="dropdown-content" id="filter-content">
                    <li class="filter-item">
                        <button type="button" aria-label="">Tillgänglighet<i
                                class="fa-solid fa-angle-down"></i></button>
                        <ul>
                            <li><label><input type="checkbox">Online</label></li>
                            <li><label><input type="checkbox">På plats</label></li>
                        </ul>
                    </li>

                    <li class="filter-item">
                        <button type="button" aria-label="">Språk<i class="fa-solid fa-angle-down"></i></button>
                        <ul>
                            <li><label><input type="checkbox">Svenska</label></li>
                            <li><label><input type="checkbox">Engelska</label></li>
                        </ul>
                    </li>
                </ul>
            </div>

        </div>

        <div class="content-area" id="items">
            <a href="../Upplagor/upplaga22.html" >
                <div class="edition">
                    <img src="../Bilder/upplaga22.jpg" alt="Upplaga 22">
                    <h3>Upplaga 22 - Den nya affärsredovisningen</h3>
                    <h4 class="available"><i class="fa-solid fa-circle-check"></i>Tillgänglig</h4>
                </div>
            </a>
            <a href="../Upplagor/upplaga21.html">
                <div class="edition">
                    <img src="../Bilder/upplaga22.jpg" alt="Upplaga 21">
                    <h3>Upplaga 21 - Den nya affärsredovisningen</h3>
                    <h4 class="non-available"><i class="fa-solid fa-circle-xmark"></i>Utlånad</h4>
                </div>
            </a>
        </div>

        <footer>Footer</footer>
    </div>
</body>

</html>
