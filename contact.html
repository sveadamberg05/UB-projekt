<!DOCTYPE html>
<html lang="sv">

<head>
    <title>Universitetsbibliotekets förbättrade sökfunktion</title>
    <meta charset="UTF-8">
    <meta name="description" content="Universitetsbibliotekets förbättrade sökfunktion">
    <meta name="author" content="Svea Damberg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7b7fa8ee5e.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <!-- script för att hämta hem ikoner, ingen egenskriven js funktion-->

</head>

<body>
    <main class="contact">
        <header>
            <nav>
                <div class="left">
                    <div class="dropdown">
                        <button type="button" aria-label="Öppna meny"><i class="fa-solid fa-bars"></i></button>
                        <ul class="dropdown-content" id="hamburger-content">
                            <li><a href="Meny/account.html">Mitt konto</a></li>
                            <li><a href="Meny/loans.html">Mina lån</a></li>
                            <li><a href="Meny/saved.html">Mina sparade</a></li>
                        </ul>
                    </div>
                    <div class="vertical-line"></div>
                    <h1 class="main-text"><a href="index.html">Bibliotek</a></h1>
                </div>

                <a href="index.html"><img id="logo" src="Bilder/umu_logga-modified.png"
                        alt="Umeå Universitet Logga"></a>

                <div class="right">
                    <div class="dropdown">
                        <button type="button" aria-label="Öppna profilmeny"><i class="fa-regular fa-user"></i></button>
                    </div>
                </div>
            </nav>
        </header>

        <div id="breadcrumb">
            <a href="../index.html">
                <p class="prev">Start</p>
            </a><i class="fa-solid fa-angle-right"></i>
            <p>Kontakta oss</p>
        </div>

        <div class="video">
            <video controls width="400" autoplay muted>
                <source src="Bilder/video.mp4" type="video/mp4">
            </video>
        </div>

        <section>
            <form action="mailto:svea.damberg05@gmail.com" method="get">
                <h2>Kontakta oss</h2>
                <label for="fname">Förnamn</label>
                <input type="text" id="fname" name="fname" placeholder="Förnamn" required>

                <label for="lname">Efternamn</label>
                <input type="text" id="lname" name="lname" placeholder="Efternamn">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required>

                <label for="subject">Ämne</label><input type="text" id="subject" name="subject" placeholder="Ämne"
                    required>
                <label for="message">Meddelande</label><textarea id="message" name="message" placeholder="Meddelande"
                    required></textarea>

                <input type="submit" value="Skicka">

            </form>
        </section>

        <footer>
            <div class="footer-text">
                <p>Umeå Universitet</p>
                <p>901 87 Umeå</p>
                <a href="contact.html">Kontakta Oss<i class="fa-solid fa-angle-right"></i></a>
            </div>
            <div class="footer-icons">
                <a href="https://www.facebook.com/umeauniversitet?locale=sv_SE" aria-label="Facebook">Facebook <i
                        class="fa-brands fa-facebook"></i></a>
                <a href="https://www.instagram.com/umeauniversitet/" aria-label="Instagram">Instagram <i
                        class="fa-brands fa-instagram"></i></a>
                <a href="https://www.linkedin.com/school/umea-universitet/" aria-label="LinkedIn">LinkedIn <i
                        class="fa-brands fa-linkedin"></i></a>
            </div>
        </footer>
    </main>
</body>

</html>
